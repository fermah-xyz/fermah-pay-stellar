# Prometheus alert rules for the gateway, the settlement worker and the chain
# observer. Each alert names what to check; docs/self-hosting/monitoring.md
# explains the metrics and what to do for each alert.
groups:
  - name: pay-stellar-money
    rules:
      - alert: PayStellarCriticalFinding
        expr: sum by (kind) (increase(pay_stellar_findings_total{severity="critical", kind!="upgrade_proposed"}[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "The observer recorded a critical {{ $labels.kind }} finding"
          action: "Read the finding in pay_stellar.reconciliation_findings and follow docs/self-hosting/observer.md"
      - alert: PayStellarWarningFinding
        expr: sum by (kind) (increase(pay_stellar_findings_total{severity="warning", kind!~"mandate_changed_elsewhere|vault_changed_elsewhere"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "The observer recorded a {{ $labels.kind }} finding"
          action: "Read the finding in pay_stellar.reconciliation_findings and follow docs/self-hosting/observer.md; an admin_change or role_changed nobody planned means the admin keys are exposed"
      - alert: PayStellarContractCodeUnexpected
        expr: pay_stellar_contract_code_expected == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Deployment {{ $labels.deployment }}'s contract runs other code than PAY_STELLAR_EXPECTED_WASM names"
          action: "If the upgrade was not planned, pause the contract and treat the admin keys as exposed; if it was, review the new code and update the expected hash"
      - alert: PayStellarContractCodeChanged
        expr: count by (deployment) (max_over_time(pay_stellar_contract_wasm[1h]) == 1) > 1
        labels: { severity: warning }
        annotations:
          summary: "Deployment {{ $labels.deployment }}'s contract started running other code in the last hour"
          action: "Confirm the upgrade was planned; one nobody made means the admin keys are exposed"
      - alert: PayStellarVaultUpgradeProposed
        expr: sum by (kind) (increase(pay_stellar_findings_total{kind="upgrade_proposed"}[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "The admin proposed new code for a vault; it installs once the timelock passes"
          action: "Review the proposed Wasm before the effective ledger in the finding; if nobody planned it, cancel it with the admin keys and treat them as exposed"
      - alert: PayStellarTreasuryDeauthorized
        expr: pay_stellar_treasury_authorized == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "USDC's issuer revoked the authorization of the USDC held for deployment {{ $labels.deployment }} (treasury trustline or vault balance)"
          action: "No deposit or withdrawal can move USDC; see the treasury_deauthorized finding in docs/self-hosting/observer.md"
      - alert: PayStellarTreasuryShort
        expr: pay_stellar_treasury_usdc + pay_stellar_cold_reserve_usdc < pay_stellar_contract_liabilities + pay_stellar_contract_revenue
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The treasury and its cold reserve, or the vault, hold less USDC than deployment {{ $labels.deployment }} owes"
          action: "Stop admitting deposits and charges, and find where the USDC went"
      - alert: PayStellarChargeQuarantined
        expr: increase(pay_stellar_charges_settled_total{result="quarantined"}[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "A charge was quarantined; its amount stays held from the buyer"
          action: "Resolve it with docs/self-hosting/quarantine.md"
      - alert: PayStellarRecurringChargeQuarantined
        expr: increase(pay_stellar_recurring_settled_total{result="quarantined"}[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "A recurring charge was quarantined; its period stays taken"
          action: "Resolve it with docs/self-hosting/quarantine.md"
      - alert: PayStellarChargeVolumeUnusual
        expr: >-
          sum by (seller_deployment_id) (increase(pay_stellar_charges_admitted_usdc_total[1h]))
            > 3 * sum by (seller_deployment_id) (increase(pay_stellar_charges_admitted_usdc_total[7d])) / 168
          and sum by (seller_deployment_id) (increase(pay_stellar_charges_admitted_usdc_total[1h])) > 10000000
          and on (seller_deployment_id)
            count by (seller_deployment_id) (pay_stellar_charges_admitted_usdc_total offset 7d)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deployment {{ $labels.seller_deployment_id }} admitted more than three times its usual hourly charge volume"
          action: "Confirm with the seller; if unexpected, revoke the deployment's API key and lower its daily limits on the contract"
      - alert: PayStellarWithdrawalsToOtherAccounts
        expr: increase(pay_stellar_withdrawals_prepared_total{destination="other"}[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "A withdrawal to an account other than the buyer's wallet was prepared"
          action: "Expected only if PAY_STELLAR_WITHDRAWALS_TO_OTHER_ACCOUNTS is on for a reason; confirm with the seller"
      - alert: PayStellarMandateChangedOutsideGateway
        expr: >-
          sum by (result) (increase(pay_stellar_recurring_settled_total{result=~"allowance_short|no_mandate"}[1h])) > 0
          or sum by (kind) (increase(pay_stellar_findings_total{kind="mandate_changed_elsewhere"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A buyer's mandate or USDC approval changed outside this gateway"
          action: "The buyer's wallet changed the approval in the USDC contract directly. Confirm with the buyer; a change nobody made means the buyer's key is exposed"
      - alert: PayStellarVaultChangedOutsideGateway
        expr: sum by (kind) (increase(pay_stellar_findings_total{kind="vault_changed_elsewhere"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A buyer's vault limit or exit was set outside this gateway"
          action: "The buyer's wallet called the vault directly; the worker has applied it to admission. Confirm with the buyer; a change nobody made means the buyer's key is exposed"
      - alert: PayStellarDeploymentQuotaReached
        expr: sum by (reason) (increase(pay_stellar_api_refusals_total{reason=~"deployment_.*_quota_exceeded|buyer_quota_exceeded"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A deployment reached its daily quota ({{ $labels.reason }})"
          action: "A burst of small deposits, mandates or buyers costs the operator fees: check the deployment's traffic before raising the quota"
      - alert: PayStellarFeeBurnHigh
        expr: sum(increase(pay_stellar_fees_charged_stroops_total[1h])) > 500000000
        labels: { severity: warning }
        annotations:
          summary: "The worker paid more than 50 XLM of fees in the last hour"
          action: "Check fees by kind on the dashboard: a burst of small deposits or mandates, or bids far above the network's, burns the fee account"
      - alert: PayStellarSourceSequenceTaken
        expr: sum by (source) (increase(pay_stellar_source_sequence_taken_total[1h])) > 0
        labels: { severity: critical }
        annotations:
          summary: "A transaction the worker did not send used the sequence of source {{ $labels.source }}"
          action: "Treat that source's key as exposed and rotate it; docs/self-hosting/limits.md"
      - alert: PayStellarSigningFailing
        expr: sum by (role) (increase(pay_stellar_signing_failures_total[10m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "The {{ $labels.role }} key failed to sign or signed for another account"
          action: "Check the key reference and the key service; nothing was sent with a bad signature"
  - name: pay-stellar-settlement
    rules:
      - alert: PayStellarContractLifeShort
        expr: pay_stellar_contract_ttl_ledgers < 60480
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "The {{ $labels.entry }} of deployment {{ $labels.deployment }}'s contract has under about 3.5 days before it is archived"
          action: "The worker extends it below about 7 days; check its logs, its sources and the fee account"
      - alert: PayStellarFeeAccountLow
        expr: pay_stellar_fee_source_spendable_stroops < 2 * 100000000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The fee account has less than twice the default floor (10 XLM) to spend"
          action: "Fund the fee account before the worker stops building new transactions"
      - alert: PayStellarFeeAccountAtFloor
        expr: pay_stellar_fee_source_spendable_stroops < 100000000
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "The fee account is at its floor; no new deposits or batches go out"
          action: "Fund the fee account; settlement resumes on its own"
      - alert: PayStellarChargesWaiting
        expr: pay_stellar_oldest_waiting_charge_seconds > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A charge has waited over ten minutes for a batch"
          action: "Check the worker's logs, its sources' sequence and the fee account's balance"
      - alert: PayStellarHotTreasuryLow
        expr: pay_stellar_hot_treasury_usdc < pay_stellar_hot_treasury_floor_usdc
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The treasury is below its floor"
          action: "Top it up from the cold reserve with a propose-transfer signed by the reserve's signers"
      - alert: PayStellarWithdrawalsWaiting
        expr: pay_stellar_oldest_waiting_withdrawal_seconds > 600
        labels: { severity: warning }
        annotations:
          summary: "A signed withdrawal has waited over ten minutes to be sent"
          action: "Check that a worker holds the treasury key, the treasury's USDC, and the withdrawal's last_error"
      - alert: PayStellarSubmissionsNotLanding
        expr: sum(increase(pay_stellar_submissions_closed_total{state=~"expired|failed|quarantined"}[30m])) > 3
        labels: { severity: warning }
        annotations:
          summary: "Transactions are expiring, failing or being quarantined"
          action: "Check the inclusion bid against the network's fees and the RPC node's health"
      - alert: PayStellarWorkerFailing
        expr: increase(pay_stellar_worker_step_failures_total[10m]) > 5
        labels: { severity: warning }
        annotations:
          summary: "The settlement worker's rounds keep failing"
          action: "Read the worker's error logs"
      - alert: PayStellarObserverLagging
        expr: pay_stellar_observer_lag_ledgers > 720
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The observer is over an hour of ledgers behind for deployment {{ $labels.deployment }}"
          action: "Check the observer and its RPC node before events leave the node's retention"
      - alert: PayStellarObserverFailing
        expr: increase(pay_stellar_observer_round_failures_total[15m]) > 3
        labels: { severity: warning }
        annotations:
          summary: "The observer's rounds keep failing"
          action: "Read the observer's error logs: the RPC node or the database is failing it"
      - alert: PayStellarObserverStalled
        expr: time() - max(pay_stellar_observer_last_round_unixtime) > 900
        labels: { severity: critical }
        annotations:
          summary: "No observer has completed a round for 15 minutes: nothing on-chain is being watched"
          action: "Check the observer's logs, its RPC node and the database; findings resume from where it stopped"
      - alert: PayStellarNodeStalled
        expr: sum(changes(pay_stellar_observer_node_latest_ledger[10m])) == 0
        labels: { severity: critical }
        annotations:
          summary: "The observer's RPC node has not advanced in 10 minutes"
          action: "The node stopped following the network, so the observer sees nothing new; point the observer at a healthy node"
      - alert: PayStellarUnobservedBinding
        expr: pay_stellar_observer_unobserved_bindings > 0
        labels: { severity: warning }
        annotations:
          summary: "A ledger binding names another USDC contract than this network's, so no observer follows it"
          action: "Correct the binding's USDC address; until then its deployment is not reconciled"
      - alert: PayStellarNoLeader
        expr: max by (role, lease) (pay_stellar_lease_held) < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "No {{ $labels.role }} process holds lease {{ $labels.lease }}; none is acting"
          action: "Check the processes' logs for database errors"
      - alert: PayStellarProcessDown
        expr: up{job=~"pay-stellar-.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not answering"
          action: "Restart it; the worker and observer resume from the database"
