global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pay-stellar-gateway
    static_configs: [{ targets: ["gateway:9101"] }]
  - job_name: pay-stellar-worker
    static_configs: [{ targets: ["worker:9102"] }]
  - job_name: pay-stellar-observer
    static_configs: [{ targets: ["observer:9103"] }]
