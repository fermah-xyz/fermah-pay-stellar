syntax = "proto3";

package fermah.pay.stellar.v1;

// Deposits into, charges against and withdrawals from buyer balances on the
// deployment's prepaid ledger contract.
//
// Scope and refusals follow the same rules as `BuyerService`: the API key
// selects the deployment, a resource of another deployment is reported as
// not found, and each refusal is one stable reason token documented in
// docs/api/ledger.md.
//
// Amounts are USDC base units: one USDC is 10,000,000 units.
service LedgerService {
  // Creates a deposit and returns the authorization entry the buyer's wallet
  // must sign. The buyer pays no network fee and needs no XLM. Repeating a
  // request with the same idempotency key, buyer and amount returns the
  // existing deposit with `created = false`; any other reuse of the key is
  // refused.
  rpc PrepareDeposit(PrepareDepositRequest) returns (PrepareDepositResponse);

  // Stores the buyer's signed authorization entry after verifying it against
  // the prepared one. The deposit is then submitted asynchronously; poll
  // `GetDeposit` for the outcome. Submitting the same signed entry again is
  // accepted and changes nothing.
  rpc SubmitDeposit(SubmitDepositRequest) returns (SubmitDepositResponse);

  rpc GetDeposit(GetDepositRequest) returns (GetDepositResponse);

  // Admits a charge: debits the buyer's available balance at once and queues
  // the charge for on-chain settlement in a batch. Repeating a request with
  // the same idempotency key, buyer and amount returns the existing charge
  // with `created = false` and debits nothing; any other reuse of the key is
  // refused.
  rpc CreateCharge(CreateChargeRequest) returns (CreateChargeResponse);

  rpc GetCharge(GetChargeRequest) returns (GetChargeResponse);

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // Creates a withdrawal of unused credit to the buyer's wallet, or to
  // another account the buyer names, and returns the authorization entry the
  // buyer's wallet must sign. Nothing is held yet. Repeating a request with
  // the same idempotency key, buyer, amount and destination returns the
  // existing withdrawal with `created = false`; any other reuse of the key is
  // refused.
  rpc PrepareWithdrawal(PrepareWithdrawalRequest) returns (PrepareWithdrawalResponse);
  // Stores the buyer's signed authorization entry after verifying it, and in
  // the same step holds the amount from the available balance: refused with
  // `insufficient_balance` when the available balance does not cover it. The
  // withdrawal is then submitted asynchronously; poll `GetWithdrawal` for the
  // outcome. Submitting the same signed entry again is accepted and changes
  // nothing.
  rpc SubmitWithdrawal(SubmitWithdrawalRequest) returns (SubmitWithdrawalResponse);
  rpc GetWithdrawal(GetWithdrawalRequest) returns (GetWithdrawalResponse);
}

enum DepositState {
  DEPOSIT_STATE_UNSPECIFIED = 0;
  // Waiting for the buyer's signed authorization entry.
  DEPOSIT_STATE_AWAITING_SIGNATURE = 1;
  // Signed and verified; waiting to be submitted.
  DEPOSIT_STATE_SIGNED = 2;
  // In a transaction sent to the network.
  DEPOSIT_STATE_SUBMITTED = 3;
  // Processed by the contract and credited to the available balance.
  DEPOSIT_STATE_CONFIRMED = 4;
  // Included as failed, and the contract never processed it.
  DEPOSIT_STATE_FAILED = 5;
  // The authorization lapsed and the contract never processed it.
  DEPOSIT_STATE_EXPIRED = 6;
  reserved 7;
  reserved "DEPOSIT_STATE_QUARANTINED";
}

message Deposit {
  string deposit_id = 1;
  string buyer_id = 2;
  int64 amount = 3;
  DepositState state = 4;
  // Base64 XDR `SorobanAuthorizationEntry` for the buyer's wallet to sign.
  // It authorizes exactly this deposit and the USDC transfer to the
  // deployment's treasury, and nothing else.
  string authorization_entry_xdr = 5;
  // Hex SHA-256 payload the wallet key signs to authorize the entry, for
  // signers that sign raw payloads rather than entries.
  string signature_payload = 6;
  // Last ledger in which the signed entry is valid.
  uint32 expiration_ledger = 7;
  // Hex hash of the transaction that carries the deposit, once submitted.
  string transaction_hash = 8;
  // Ledger that included it, once confirmed or failed on-chain.
  uint32 ledger = 9;
  string created_at = 10;
}

message PrepareDepositRequest {
  string buyer_id = 1;
  int64 amount = 2;
  // 1-128 characters of [A-Za-z0-9._:@+-], unique within the deployment.
  string idempotency_key = 3;
}

message PrepareDepositResponse {
  Deposit deposit = 1;
  bool created = 2;
}

message SubmitDepositRequest {
  string deposit_id = 1;
  // Base64 XDR of the entry from `PrepareDeposit`, with the wallet's
  // signature set and every other field unchanged.
  string signed_authorization_entry_xdr = 2;
}

message SubmitDepositResponse {
  Deposit deposit = 1;
}

message GetDepositRequest {
  string deposit_id = 1;
}

message GetDepositResponse {
  Deposit deposit = 1;
}

enum ChargeState {
  CHARGE_STATE_UNSPECIFIED = 0;
  // Debited from the available balance; waiting for a batch.
  CHARGE_STATE_ADMITTED = 1;
  // In a batch sent to the network.
  CHARGE_STATE_SUBMITTED = 2;
  // Settled on-chain.
  CHARGE_STATE_CHARGED = 3;
  // Refused by the contract; the amount was returned to the available
  // balance. `outcome` says why.
  CHARGE_STATE_REFUSED = 4;
  // The contract's answer contradicts the gateway's records; the amount
  // stays debited while an operator reviews.
  CHARGE_STATE_QUARANTINED = 5;
}

message Charge {
  string charge_id = 1;
  string buyer_id = 2;
  int64 amount = 3;
  reserved 4;
  reserved "sequence";
  ChargeState state = 5;
  // The outcome token once settled: `charged`, `insufficient_balance`,
  // `above_limit`, `above_daily_limit` or `expired`; for a quarantined charge, `duplicate` or
  // `unknown_account` when the contract answered so.
  string outcome = 6;
  string transaction_hash = 7;
  uint32 ledger = 8;
  string created_at = 9;
  // Hex identifier of the charge on the contract, derived from the
  // idempotency key: every retry names the same charge.
  string contract_charge_id = 10;
  // Last ledger in which the contract accepts the charge. A charge not
  // settled by then is refused as `expired` and its amount returned.
  uint32 last_ledger = 11;
}

message CreateChargeRequest {
  string buyer_id = 1;
  int64 amount = 2;
  // 1-128 characters of [A-Za-z0-9._:@+-], unique within the deployment.
  string idempotency_key = 3;
}

message CreateChargeResponse {
  Charge charge = 1;
  bool created = 2;
}

message GetChargeRequest {
  string charge_id = 1;
}

message GetChargeResponse {
  Charge charge = 1;
}

message GetBalanceRequest {
  string buyer_id = 1;
}

message GetBalanceResponse {
  // What new charges may still debit.
  int64 available = 1;
  // Admitted or submitted charges not yet settled on-chain.
  int64 pending_charges = 2;
  // Held for signed withdrawals not yet final.
  int64 pending_withdrawals = 3;
}

enum WithdrawalState {
  WITHDRAWAL_STATE_UNSPECIFIED = 0;
  // Waiting for the buyer's signed authorization entry; nothing is held.
  WITHDRAWAL_STATE_AWAITING_SIGNATURE = 1;
  // Signed and verified, and the amount is held; waiting to be submitted.
  WITHDRAWAL_STATE_SIGNED = 2;
  // In a transaction sent to the network.
  WITHDRAWAL_STATE_SUBMITTED = 3;
  // Processed by the contract: the USDC was sent to the destination.
  WITHDRAWAL_STATE_CONFIRMED = 4;
  // Included as failed, and the contract never processed it; the held
  // amount was returned to the available balance.
  WITHDRAWAL_STATE_FAILED = 5;
  // The authorization lapsed and the contract never processed it; any held
  // amount was returned to the available balance.
  WITHDRAWAL_STATE_EXPIRED = 6;
}

message Withdrawal {
  string withdrawal_id = 1;
  string buyer_id = 2;
  int64 amount = 3;
  // Account that receives the USDC.
  string destination = 4;
  WithdrawalState state = 5;
  // Base64 XDR `SorobanAuthorizationEntry` for the buyer's wallet to sign.
  // It authorizes exactly this withdrawal (amount, destination and
  // identifier) and nothing else.
  string authorization_entry_xdr = 6;
  // Hex SHA-256 payload the wallet key signs to authorize the entry, for
  // signers that sign raw payloads rather than entries.
  string signature_payload = 7;
  // Last ledger in which the signed entry is valid.
  uint32 expiration_ledger = 8;
  // Hex hash of the transaction that carries the withdrawal, once submitted.
  string transaction_hash = 9;
  // Ledger that included it, once confirmed or failed on-chain.
  uint32 ledger = 10;
  string created_at = 11;
}

message PrepareWithdrawalRequest {
  string buyer_id = 1;
  int64 amount = 2;
  // `G...` account to receive the USDC; the buyer's wallet when empty. It
  // must hold a USDC trustline.
  string destination = 3;
  // 1-128 characters of [A-Za-z0-9._:@+-], unique within the deployment.
  string idempotency_key = 4;
}

message PrepareWithdrawalResponse {
  Withdrawal withdrawal = 1;
  bool created = 2;
}

message SubmitWithdrawalRequest {
  string withdrawal_id = 1;
  // Base64 XDR of the entry from `PrepareWithdrawal`, with the wallet's
  // signature set and every other field unchanged.
  string signed_authorization_entry_xdr = 2;
}

message SubmitWithdrawalResponse {
  Withdrawal withdrawal = 1;
}

message GetWithdrawalRequest {
  string withdrawal_id = 1;
}

message GetWithdrawalResponse {
  Withdrawal withdrawal = 1;
}
