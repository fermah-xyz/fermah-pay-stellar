[package]
name = "fermah-pay-stellar-vault"
description = "Soroban prepaid vault: holds buyers' USDC and the ledger, with buyer-signed spending limits and an exit that needs no operator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
proptest.workspace = true
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
