[package]
name = "fermah-pay-stellar-example-account"
description = "A minimal Soroban contract account authorized by one Ed25519 key: a stand-in for a smart wallet in tests and testnet evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
