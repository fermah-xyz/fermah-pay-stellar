# Supply-chain policy: every dependency must come from crates.io under a
# license compatible with distributing this project as Apache-2.0.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained, not vulnerable. It is a compile-time proc macro
    # reached only through the Soroban host and SDK, so none of its code is in
    # the contract Wasm or the gateway binary, and no maintained replacement
    # is available to those upstream crates.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc macro required by the Soroban host" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
