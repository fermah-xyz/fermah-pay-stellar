[package]
name = "fermah-pay-stellar-proto"
description = "Generated gRPC types for the Fermah Pay Stellar gateway API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

# Referenced only by the code `build.rs` generates into OUT_DIR, which
# cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
